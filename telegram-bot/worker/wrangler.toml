name = "qmods-telegram-bot"
main = "src/index.ts"
compatibility_date = "2024-11-01"
# Намеренно без compatibility_flags = ["nodejs_compat"]: код не использует
# Node.js API (нет node:events/node:stream/...), а флаг тянет в бандл
# крупный набор Node-полифиллов (unenv), который только раздувает Worker
# и может путать сторонние просмотрщики кода в дашборде.

# D1 — собственное операционное хранилище бота (НЕ пользователи QMods):
# диалоговые состояния, рейт-лимиты, аудит-лог админ-действий.
# Создать: `wrangler d1 create qmods-telegram-bot`, затем вставить
# сюда полученный database_id.
[[d1_databases]]
binding = "DB"
database_name = "qmods-telegram-bot"
database_id = "b2c7e985-5e1e-42f1-a8e2-a5df52f0ec22"

# Статика — изображения маскота (Киры), отдаются напрямую платформой
# (не через код воркера) по путям вида /img/kira-hero.webp. Публично
# доступны, значит годятся и для Telegram sendPhoto (принимает URL),
# и для <img src> в Mini App.
[assets]
directory = "./public"

# Периодическая доставка отложенных уведомлений (оплата, окончание
# подписки, новости) — см. src/index.ts::scheduled(). Раз в 5 минут
# достаточно и укладывается в бесплатный лимит крон-триггеров.
[triggers]
crons = ["*/5 * * * *"]

# Секреты (НЕ хранить в этом файле, задаются через `wrangler secret put`):
#   TELEGRAM_BOT_TOKEN            — токен бота от @BotFather
#   TELEGRAM_WEBHOOK_SECRET       — случайная строка, см. README (setWebhook secret_token)
#   QMODS_BOT_API_TOKEN           — токен для mod/api/bot.php (пользовательский)
#   QMODS_ADMIN_BOT_API_TOKEN     — токен для mod/admin/bot.php (админский)
#   YOOMONEY_NOTIFICATION_SECRET  — секрет из настроек HTTP-уведомлений кошелька ЮMoney, см. README «Оплата через ЮMoney»
#
# Обычные переменные (можно оставить в vars, значения не секретны):
[vars]
QMODS_API_BASE = "https://qmods.ru"
QMODS_CABINET_URL = "https://qmods.ru/mod/cabinet.php"
QMODS_SUBSCRIBE_URL = "https://qmods.ru/subscribe/"
QMODS_SUPPORT_URL = "https://qmods.ru/mod/support.php"
# Список Telegram ID администраторов через запятую.
ADMIN_TELEGRAM_IDS = "5110155633"
# @username бота (без @) — нужен, чтобы строить t.me-ссылки (deep link для
# привязки приложения к аккаунту через бота, см. /device/pair/start).
BOT_USERNAME = "qmods_bot"
# Публичный origin этого же воркера (без пути в конце). Подставь свой, если
# домен воркера отличается — иначе не покажется кнопка "Открыть в Mini App"
# и не будут отправляться фото Киры (оба берут путь от этого URL).
PUBLIC_URL = "https://update.qmurzik7.workers.dev"
# Номер счёта кошелька ЮMoney (получатель платежей) — см. README «Оплата
# через ЮMoney». Не секрет (это просто номер счёта), но обязателен для
# оплаты — без него /pay/* ссылки будут вести на невалидный Quickpay-запрос.
YOOMONEY_WALLET = "4100119562830064"
